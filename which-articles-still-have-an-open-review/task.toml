[metadata]
scenario_name = "which articles still have an open review"
scenario_description = "=== INTENT ===\nA review-status sweep of the patient-education article library on the notion gym: for every article\npage in the Articles database (id 9caee280db7e4c9385908af1164446fb), whether the reviewer thread on it has\nbeen settled or is still waiting on somebody, broken down by the stage the article is at, plus the\narticles nobody has commented on at all. Ends in two files under /workspace; no gym write is asked\nfor and a write is graded against. Mined from seed d6e6a015-4ee4-56a7-9b9e-61996289bb3f\n(family cli, shape existing-page-read-and-context-load, sources notion_mcp), whose client ask was a\nNotion context load: open the existing pages behind a piece of work and read what is on them. Kept:\nthe open-the-existing-page-and-read-what-is-really-on-it mechanism, which on this corpus can only be\nserved one page at a time. Dropped: the seed's personal-context preamble (its expertise list, its\nmailbox and its timezone), which has no counterpart in this workspace, and its redacted email\naddress, which is not reachable on any served gym.\n\n=== CONNECTOR ===\nnotion-gym on container port 8019, reached through the in-container proxy at\nhttp://localhost:7000/mcp/notion-gym. Acting user u-morgan-lee, picked by measured ownership: 196 pages\ncreated, the most of any user, and a member of 8 of the 10 teams. Header x-notion-user-token with\nthe token in metadata.mcp_servers_extended.access_token. Tenancy header x-database-id; the proxy\nmints a per-run database id and seeds it through /reset from the gym's baked synthetic snapshot.\n18 tools are served. Three carry this task:\n  notion-search              locates the Articles database and its data source by title\n  notion-fetch               hydrates the database: the data source url and its SQL table shape\n  notion-query-data-sources  arbitrary read-only SQL over that data source\n  notion-get-comments        the discussions on ONE page - there is no bulk form\n\n=== HOPS ===\nhops=20 chain_depth=4 over 21 steps.\n  notion-search              1   (not a hop - depends_on is empty)\n  notion-fetch               1\n  notion-query-data-sources  1\n  notion-get-comments       18\n  Computed from the depends_on graph in solution/trajectory_graph.json under strict argument\n  provenance: a step depends only on the steps whose OUTPUT supplied its arguments. The 18\n  per-page reads are forced by the served surface, not by padding, and this was measured on the\n  gym before the figures were fixed:\n    - notion-query-data-sources takes arbitrary SQL over the data source, so every pure row\n      aggregate over the Articles table collapses to ONE call. No graded figure here is one.\n    - discussions and comments are not columns of that data source at all. They are reachable\n      only through notion-get-comments, which takes a single page_id, has no bulk mode and no\n      array form, and returns the resolved flag that every graded figure turns on.\n    - SQL cannot return an id column: SELECT id, Title FROM the collection fails with\n      connector tool call failed. The 18 page ids therefore have to come from the url column of\n      the SQL result (or from notion-fetch / notion-search), which is what makes each per-page\n      read depend on an earlier step rather than on a literal in the prompt.\n  So the shortest correct path is 20 calls (fetch the database, one SQL read, 18 comment reads)\n  against 20 declared hops - ratio 1.0. Measured, not asserted: consistency/shortcut_audit.md.\n\n=== HIDDEN RULES ===\n(the agent must infer these; none of them is stated in the prompt)\n  - NOTION-GET-COMMENTS HIDES EVERYTHING BY DEFAULT. {page_id} alone returns\n    <discussions total-count=0> on every one of the 18 pages, including the 14 that carry a\n    thread, because the discussions hang off child blocks. include_all_blocks true is required.\n    A run that trusts the default concludes there are no threads anywhere and answers\n    still_open 0 and articles_without_comments 18.\n  - AND IT HIDES THE SETTLED ONES TOO. include_resolved defaults to false, so the three articles\n    whose thread has been resolved come back looking like articles with no thread at all. A run\n    that sets include_all_blocks but not include_resolved answers articles_without_comments 7.\n  - RESOLVED IS A PROPERTY OF THE THREAD, NOT OF THE COMMENT. The resolved flag sits on the\n    discussion; the comments under it carry only text, an author and a timestamp.\n  - DOC STAGE IS FREE TEXT AND IT IS SOMETIMES ABSENT. It is a rich_text property, not a select,\n    so it has no option list to enumerate; its four values here are New, Draft, In Review and\n    null. The four nulls are exactly the four articles that carry no thread, so no reviewed\n    article is missing a stage and the three stage figures add up to still_open.\n  - TITLES REPEAT IN THIS WORKSPACE. Four different databases are titled Feature List and two\n    article pages are titled Article and Title example. The Articles database has to be pinned by\n    id; a title match is not enough.\n  - THE DATA SOURCE IS NOT THE DATABASE. notion-query-data-sources wants\n    collection://ds-<id>, which only comes back from notion-fetch or notion-search; passing the\n    database id fails.\n\n=== GOLD ===\n(grader metadata, NOT shown to the agent. Every figure was derived TWICE on the pinned image on\n2026-09-27: through the served gym as u-morgan-lee via the proxy at :7000 (notion-search ->\nnotion-fetch -> notion-query-data-sources -> 18 x notion-get-comments with include_all_blocks true\nand include_resolved true), and by SQL over the root state route of the same running gym. The two\nagreed on every figure.)\n\n{\n  \"articles_reviewed\": 14,\n  \"still_open\": 11,\n  \"still_open_new\": 5,\n  \"still_open_draft\": 2,\n  \"still_open_in_review\": 4,\n  \"articles_without_comments\": 4\n}\n\nArticles database 9caee280db7e4c9385908af1164446fb, data source\ncollection://ds-9caee280db7e4c9385908af1164446fb. 18 article pages, 14 of them carrying exactly one\ndiscussion each, 19 comments in total. 3 discussions are resolved, 11 are not, 4 pages carry none.\nDoc stage (a rich_text property) is New on 7, Draft on 2, In Review on 5 and null on 4, and the 4\nnulls are exactly the 4 pages with no thread.\n\nState SQL, one statement each, run on the root state route as notion-gym:\n  articles_reviewed\n    SELECT COUNT(DISTINCT c.page_id) FROM comments c JOIN pages p ON p.id = c.page_id\n    WHERE p.parent_id = '9caee280db7e4c9385908af1164446fb'\n    -> 14\n  still_open\n    SELECT COUNT(DISTINCT d.page_id) FROM discussions d JOIN pages p ON p.id = d.page_id\n    WHERE p.parent_id = '9caee280db7e4c9385908af1164446fb' AND d.resolved = 0\n    -> 11\n  still_open_new / still_open_draft / still_open_in_review\n    the same query with a join onto the Doc stage rich_text value\n    (property_values joined to rich_text_spans.plain_text) grouped by that value\n    -> New 5, Draft 2, In Review 4\n  articles_without_comments\n    SELECT COUNT(*) FROM pages p WHERE p.parent_id = '9caee280db7e4c9385908af1164446fb'\n    AND NOT EXISTS (SELECT 1 FROM discussions d WHERE d.page_id = p.id)\n    -> 4\n  and the three read-only prohibitions, all measured on seed state:\n    SELECT COUNT(*) FROM pages WHERE parent_id = '9caee280db7e4c9385908af1164446fb' AND in_trash = 0            -> 18\n    SELECT COUNT(*) FROM discussions WHERE resolved = 1 AND page_id IN (...)          -> 3\n    SELECT COUNT(*) FROM comments WHERE page_id IN (...)                              -> 19\n\nReviewed and still open (11): Antenatal Testing, Aspirin in Pregnancy, Fertility after Pregnancy, Foods to avoid, Group B Streptococcus, Induction of Labor, Intercourse During Pregnancy, Thinking about a massage?, Title example, Ultrasound in Pregnancy, Vaginitis & BV.\nReviewed and settled (3): Birthing Options, Nausea and Vomiting, Pregnancy Schedules.\nNo thread at all (4): Article, Exercise with bump, New Brainstorm, New Product Spec (PRD).\nArticles carrying two comments: Antenatal Testing, Birthing Options, Foods to avoid, Title example,\nUltrasound in Pregnancy. That five-way fan-out is the whole gap between the two readings.\n\nDeliverables: /workspace/review_log.md (19 comment lines plus the 4 uncommented articles) and\n/workspace/metrics.xlsx (the six figures above). No gym write is asked for; three database_state\nverifiers grade that none happened.\n\n=== DECOYS ===\n(one line per graded figure: the wrong value a plausible method yields; the same list as each\nverifier's metadata.why_justification, and every one of them computed against this gym.)\n  articles_reviewed = 14\n      count the comments instead of the articles carrying them (THE LEVER'S\n      DEFAULT MISREADING)                                                      -> 19\n      count every page in the database, reviewed or not                        -> 18\n      leave include_all_blocks at its default and find no thread anywhere       -> 0\n  still_open = 11\n      count the comments sitting on an unsettled thread rather than the\n      articles carrying one (THE LEVER'S DEFAULT MISREADING)                   -> 15\n      count every article that has no settled thread, folding in the four that\n      carry no thread at all                                                    -> 15\n      leave include_all_blocks at its default                                   -> 0\n  still_open_new = 5\n      count comments rather than articles (the default misreading)              -> 6\n      count every article whose Doc stage is New, settled or not                -> 7\n  still_open_draft = 2\n      count comments rather than articles (the default misreading)              -> 4\n      leave include_all_blocks at its default                                   -> 0\n  still_open_in_review = 4\n      count comments rather than articles (the default misreading)              -> 5\n      count every article whose Doc stage is In Review, settled or not          -> 5\n  articles_without_comments = 4\n      leave include_resolved at its default, so the three settled articles look\n      like articles with no thread at all                                       -> 7\n      leave include_all_blocks at its default                                   -> 18\n  review log, row coverage = 19 comment lines and the 4 uncommented articles named\n      write one line per article instead of one per comment                    -> 14 lines\n      leave include_resolved at its default and log only the open comments     -> 15 lines\n      give the four uncommented articles a comment line of their own           -> 23 lines\n  review log, reconciliation = the 11 open articles, and only those, on an open line\n      read the resolved flag off the comment instead of off the thread         -> 14 marked open\n      leave include_resolved at its default, so a settled article never appears\n      on any line and the log stops covering the database                      -> 15 lines, 11 open\n  review log, finding and stage coverage = 15 open lines and 4 settled; 9 New, 4 Draft, 6 In Review;\n      the 3 settled articles each on a settled line\n      drop the settled comments and pad the count with duplicate open lines\n      so three articles vanish from the file                                -> 19 open, 0 settled\n      leave include_resolved at its default                                 -> 15 lines, 0 settled\n      write the lines without reading each article's Doc stage property     -> a stage column\n                                                                               that is not 9/4/6\n  read-only prohibition\n      resolve or re-open a thread to tidy the library up          -> resolved count moves off 3\n      leave a summary comment on each article that is still open  -> comment count moves off 19\n\n=== SEED ===\nd6e6a015-4ee4-56a7-9b9e-61996289bb3f (family cli, shape existing-page-read-and-context-load,\nsources notion_mcp), materialised into kit/aster/seeds/backlog/cli/d6e6a015-4ee4-56a7-9b9e-61996289bb3f.json\nfrom client_query_trajectory_6.jsonl. gold_path is deliberately empty in the seed file: a seed never\nsupplies a figure. Client ask: a Notion context load - open the existing pages behind a piece of\nwork and read what is on them. No client_seed.\n\n=== HARDENING ===\nLEVER: A (unit of audit)\nENTITY: article (page id)\nSENTENCE: 'The unit of audit is the article: one article (`page id`) may carry several comments. Findings are assessed comment by comment; the summary counts of flagged and of each finding are counts of articles, by the finding reported for each comment in the review log.'\nLIVES IN: instruction.md (the documented weaker fallback). Measured, not chosen: this workspace\ncarries no governing object that could host the rule. The Articles data source description is the\nempty string, every page in the database is an article rather than a register or a policy note, no\nother data source has a relation property pointing at Articles, and no page outside the database\nmentions an article by title. Creating one would need a gym write, which this batch forbids\n(the shared probe container is read-only).\nCOUNTS MOVED: articles_reviewed 14 (at comment grain: 19), still_open 11 (at comment grain: 15),\nstill_open_new 5 (at comment grain: 6), still_open_draft 2 (at comment grain: 4),\nstill_open_in_review 4 (at comment grain: 5). Five of the six graded counts move.\narticles_without_comments 4 is the same under both readings and is declared unmoved. The gap comes\nfrom the five articles that carry two comments each.\nDEFAULT MISREADING: count the comments instead of the articles carrying them and the summary reads\narticles_reviewed 19, still_open 15, still_open_new 6, still_open_draft 4, still_open_in_review 5,\nwith articles_without_comments 4 unchanged. Built as a real workbook beside the correct review log\nand run through the bundle's own verifier engine: it fails exactly metrics_articles_reviewed,\nmetrics_still_open, metrics_still_open_new, metrics_still_open_draft and\nmetrics_still_open_in_review, and no per-row check - review_log_lists_every_reviewer_comment,\nreview_log_reconciles_the_open_articles_by_article and review_log_accounts_for_every_article_and_both_findings\nall three pass on it, because the review log is identical under both readings. Evidence:\n_evidence/which-articles-still-have-an-open-review/default_misreading/.\nPER-ROW COVERAGE: the review log still carries one line for every one of the 19 reviewer comments\nand then names the 4 articles carrying none, so all 18 articles appear in it; only the six summary\nfigures are taken per article. review_log_lists_every_reviewer_comment grades exactly that, and\nreview_log_reconciles_the_open_articles_by_article groups those rows by article and checks the set\nagainst still_open. Added 2026-09-27, review_log_accounts_for_every_article_and_both_findings\ncloses the coverage the first two leave open: it splits the 19 lines into the 15 open and the 4\nsettled, counts the lines carrying each Doc stage (9 New, 4 Draft, 6 In Review - the column no\nassertion reached before), requires each of the 3 settled articles on a settled line and refuses a\nsettled line for any of the 11 open ones, so every one of the 18 articles is now pinned somewhere\nin the log. Measured through the bundle's own engine before it existed, three materially incomplete\nlogs scored every file_check: one that dropped the 4 settled lines and padded the count with\nduplicate open lines (three articles then absent from the file), one that invented the settled\nlines against titles not in the database, and one that wrote a junk Doc stage on every line. All\nthree are refused now, and the gold log and all three renderer logs still score 9 of 9.\nBLIND READER SPLIT: 0 of 4 took the default reading (still_open 15 instead of 11) in\nreaders-20260927-r2 - a weak bite, recorded as measured and not waived. Two independent rounds were\nrun (readers-20260927-r1 on the first prompt, readers-20260927-r2 after a qc_precheck fix to it) and\nall eight blind readers stated the article-grain method for every figure. r1 also returned the\nfinding that set this task's gold for articles_reviewed. The one strengthening HARDENING-LEVERS\noffers for a weak split is to move the sentence into a gym object the prompt only names; measured on\nthis workspace there is none (see LIVES IN) and no write may be made to the gym in this batch, so it\nwas not available. The lever is still enforced against a lazy run: every one of the five moved\ncounts is graded at article grain and refuses its comment-grain value, and the reconciliation check\nties the summary back to the per-row log. Proven, not asserted - the comment-grain workbook was\nbuilt and scored through the bundle's own engine, and it fails exactly those five verifiers.\nSHAPE TOLERANCE: widened 2026-09-27 after client QC run check-20260927-152723, which failed\nlayer1_clarity_scope (representation_contract) and layer5_verifier_fairness_static\n(semantic_equivalence, surface_form_brittleness) on ONE root cause - the review_log.md matchers were\ntoo STRICT. Executed against correct-content variants, two legitimate Markdown shapes were refused: the\n19 comment lines rendered as a GFM table whose title column is headed 'Article' (that header row matched\nreview_log_refuses_a_comment_line_for_an_uncommented_article, which fired on 'title | any cell |'), and\nthe closing list written as a numbered list (the four review_log_names_*_as_uncommented leaves took only\na bare title or a '-'/'*' bullet). The instruction discloses the line template\n'article title | Doc stage | open' and 'a clearly labelled list, one title per line' and nothing about\nMarkdown shape, so the matchers were widened, never the prompt. Five leaves changed, all in\nreview_log_lists_every_reviewer_comment: the four membership leaves now take a bare title, any ordinary\nlist marker ('-', '*', '+', '1.', '1)') or a single-cell table row that is not a GFM header, and the\npaired refusal became the exact mirror of the two others - it fires only on a line whose LAST\npipe-separated field is the finding. No figure, no prompt text, no gold and no lever moved, and no leaf\nwas removed or weakened in content. Replayed both directions through the bundle's own engine over 30\ncases: nine correct-content renderings score 9 of 9 (seven of them were refused before), and every\nwrong-content artefact still fails, including the three the coverage repair was built against - which\nfail on exactly the same leaves as before - a single manufactured comment line for an uncommented\narticle that only that refusal catches, and a one-column closing table whose header is offered in place\nof the missing entry. Evidence:\n_evidence/which-articles-still-have-an-open-review/shape_tolerance_repair/.\n"


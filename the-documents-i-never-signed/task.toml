[metadata]
scenario_name = "the documents I never signed"
scenario_description = "=== INTENT ===\nSignature close-out over one mailbox's document-service mail: which documents the service asked\nthis user to sign, which it had to chase, and which were ever signed. Ends in a drafted reply\nnaming the ones still owed. Mined from seed 99c3aa21-be69-5ee9-a55a-7a899313e081 (gcal,\ninbox-search-and-triage), whose client ask was a mailbox operating standard - go over what the\ninbox has been carrying and write the rule down. Kept: the sweep-the-whole-stream-and-reconcile\nshape and the write-back it ends in. Dropped: the seed's project/knowledge-wiki plumbing and its\nfilter XML, which have no counterpart in this corpus.\n\n=== CONNECTOR ===\nemail-calendar-gym on container port 8016. Acting user 5182a2ef-dded-5b63-8389-49d8101f5c38\n(1045 messages, 681 threads, 15 user labels, and the only identity on the gym that owns a real\nmailbox and a real calendar). Header x-email-user-token with the token in\nmetadata.mcp_servers_extended.access_token. Tenancy header x-database-id; the proxy mints a\nper-run database id and seeds it through /reset from the gym's built-in synthetic snapshot.\nFive tools only - search_email, draft_email, send_email, search_calendar, update_calendar. There\nis no per-item read: no get_message, no get_thread, no label tool, no draft list.\n\n=== HOPS ===\nhops=3 chain_depth=3 over 4 steps.\n  search_email   3   (s1 is not a hop - depends_on is empty)\n  draft_email    1\n  Computed from the depends_on graph in solution/trajectory_graph.json under strict argument\n  provenance: a step depends only on the steps whose OUTPUT supplied its arguments. s1 sweeps the\n  word signature - 111 matches against a per-query page cap of 50, so it comes back truncated -\n  and what it is for is the SHAPE of the stream: the request, reminder and person-keyed subject\n  lines. This gym has five tools and no per-item read, so a message is reachable only through\n  search_email, and the phrasings that partition the log appear nowhere but in the subjects that\n  sweep returns; the completion family is invisible to s1's own query, because those subjects say\n  signed and never signature. s2 therefore carries four phrases lifted verbatim out of s1's\n  results and returns the log in full (36/46/12/1, 95 unique, truncated false). s3 re-asks for the\n  request family with label:Opened because no search result payload carries labelIds at any page\n  size - that is the only way register membership can be resolved, and it returns 18 of the 36.\n  s4's body is what the intersection of s2 and s3 leaves. chain_depth is the longest dependency\n  path, s1 -> s2 -> s4 = 3, which is this gym's floor and its honest ceiling: batch_gate's own\n  comment says the deepest honest path here is three levels because with no per-item read there is\n  nothing to chain into. Nothing was padded to reach it. The shortest honest path is 3 calls (s2\n  and s3 merge into one five-query call, since pageSize is per query and every bucket is under\n  50), ratio 3/3 = 1.00, measured in consistency/shortcut_audit.md. search_calendar is never\n  called: this is a mail-only question, and that tool cannot add depth anyway - its pageSize maxes\n  at 2500 against 2330 served events, so it never truncates.\n=== HIDDEN RULES ===\n(the agent must infer these; none of them is stated in the prompt)\n  - THE SWEEP HAS TO BE PAGED, AND PAGING HAS TO BE ASKED FOR. With pageSize omitted, search_email\n    returns 20 rows per query, truncated true and NO nextPageToken at all, so a run that never\n    passes pageSize cannot finish. With pageSize 50 the 111-message signature sweep takes three\n    calls.\n  - ONE WORD DOES NOT COVER THE STREAM. Searching signature returns 111 messages and misses every\n    completion notice, because those say signed and never signature. Searching signed returns 20.\n    The union is what the log is.\n  - QUOTED AND UNQUOTED ARE DIFFERENT QUERIES, AND FREE TEXT READS THE SNIPPET TOO. \"You just\n    signed\" returns 12, bare You just signed returns 13, bare signed returns 20. A quoted search\n    for a document's own name overshoots as well: \"results (4).pdf\" returns 33 messages spanning\n    three different documents, and \"hi.jpeg\" returns 9 against a true 8. Every graded count has to\n    come from a classified subject set, never from total_matches.\n  - THE LABEL IS IN NO PAYLOAD. A search result carries email_id, thread_id, snippet,\n    internal_date_ms, from, to, cc, subject and date, and nothing else - no labelIds, no\n    importance, no body. Register membership can only be resolved by re-issuing the request query\n    with label:Opened and intersecting the id sets.\n  - AT LEAST ONE, NOT ALL. Six documents have several request messages with only some of them\n    filed under Opened. Reading the register as every request message filed there answers 3\n    instead of 10.\n  - NAMES THAT LOOK THE SAME ARE NOT. Emily (Em) Clark-05-20-25.pdf and Emily (Em)\n    Clark-05-20-25 (2).pdf are two documents with opposite outcomes; results (4).pdf, Carmen\n    Squires - results (4).pdf and Joshua Graham - results (4).pdf are three.\n  - THE SENDER NAME IS NOT THE DOCUMENT'S IDENTITY. Two of the 95 document messages arrive under a\n    different sender name from the rest of their own document's mail - one request and one\n    completion, on two different documents - so a run that keys a document on sender plus name\n    splits both of them in two.\n  - SOME OF THIS MAIL IS NOT ABOUT DOCUMENTS AT ALL. 22 notices name who a request went out to and\n    7 name who completed one; both are keyed to a person. A further 54 are a standing consent-form\n    blast that names no document. None of the three is a row.\n\n=== GOLD ===\n(grader metadata, NOT shown to the agent. Every figure below was derived twice on the served gym\nagainst the pinned image - once through the agent route as the acting user via the proxy on :7000,\nand once through the root-only state route over message_headers and message_labels. Both routes\nagreed on every figure.)\n\nThe log holds 95 messages - thirty-six asking for a signature on a named document, forty-six\nchasing one, twelve saying a document was signed and one saying everyone had signed one - and they\nname fifteen documents between them. The four graded summary figures:\n\n{\n  \"documents_tracked\": 10,\n  \"tracked_never_signed\": 2,\n  \"tracked_signed_after_a_reminder\": 5,\n  \"tracked_signed_with_no_reminder\": 3\n}\n\nThe 15 documents, with request count, reminder count, signed and register membership:\n  2 documents                                                        1   2  no   out\n  Carmen Squires - results (4).pdf                                   6   8  yes  in\n  Chuntelle (Chan) Williams-Jones - Urban Lotus Informed Consent.pdf 1   0  yes  in\n  D7VISA_PASSIVE_INCOME_PENSIONISTS_DIGITAL_NOMADS_GUIDE.pdf         1   0  yes  in\n  Dr. Joel Rivera-05-20-25.pdf                                       2   1  no   out\n  Emily (Em) Clark-05-20-25 (2).pdf                                  3   2  yes  in\n  Emily (Em) Clark-05-20-25.pdf                                      2   4  no   in\n  Jasmine Underwood (Em) Justin Glass-05-20-25 (2).pdf               1   2  yes  out\n  Joshua Graham - results (4).pdf                                    4   4  yes  in\n  Michele Nizza-05-20-25.pdf                                         5  13  no   in\n  Multiple Services Superbill - 06-27-2025.pdf                       1   0  yes  out\n  hi.jpeg                                                            3   4  yes  in\n  labels (1).pdf                                                     3   4  yes  out\n  prenatalDebbie.pdf                                                 1   0  yes  in\n  results (4).pdf                                                    2   2  yes  in\nThe request column sums to the request-family total and the reminder column to the\nreminder-family total; both were measured both ways.\n\nThe register is the ten documents at least one of whose request messages carries the user label\nOpened (id ea900f63-0dea-592c-84a1-3452922c0af3, 326 messages gym-wide). 18 of the 36 request\nmessages carry it - a clean half - and they fall across those ten names. The register partitions\nexactly: 2 never signed + 5 signed after a reminder + 3 signed with no reminder = 10.\n\nSigned means the log holds a message saying the document was signed. 12 such messages name 10\ndocuments (Joshua Graham - results (4).pdf has three), and one further notice says everyone has\nsigned Multiple Services Superbill - 06-27-2025.pdf, which the prompt scopes in, giving 11 signed\nand 4 unsigned across the whole log.\n\nDeliverable: /workspace/audit.xlsx - sheet Documents (header row plus the 15 rows above) and\nsheet Summary (header row plus the four metric rows) - and one drafted email, subject\nDocuments still awaiting my signature, body the two unsigned register documents one per line.\nThe acting user owns 0 drafts in the seed, so the write-back is a clean 0 to 1.\n\n=== DECOYS ===\n(one line per graded figure: the wrong value a plausible method yields; the same list as each\nverifier's metadata.why_justification, and every one of them proven against the corpus.)\n  documents_in_the_log = 15\n      fold the two Emily names together                                        -> 14\n      key a document on a substring, conflating the three results (4).pdf names -> 13\n      drop the aggregate request 2 documents because it names no file           -> 14\n      add a row for the standing consent-form notice                            -> 16\n      report the register only                                                  -> 10\n  documents_tracked = 10\n      count every document in the log                                           -> 15\n      read the register as EVERY request message filed under Opened             -> 3\n      infer the register from the document having been chased                   -> 11\n  tracked_never_signed = 2\n      take the count over the whole log                                         -> 4\n      fold the two Emily names together                                         -> 1\n  tracked_signed_after_a_reminder = 5\n      take the count over the whole log                                         -> 7\n      conflate the three names ending in results (4).pdf                        -> 3\n  tracked_signed_with_no_reminder = 3\n      take the count over the whole log                                         -> 4\n      read a quoted name search's total_matches as its reminder count           -> 0\n  per-document reminder counts\n      read total_matches for the quoted name instead of classifying subjects    -> 3, 2, 2 where\n      the gold is 0, 0, 0 on the three never-chased documents\n  write-back set = {Emily (Em) Clark-05-20-25.pdf, Michele Nizza-05-20-25.pdf}\n      take the unsigned set over the whole log                                  -> 4 documents\n      fold the two Emily names together                                         -> 1 document\n      write to every register document                                          -> 10 documents\n\n=== SEED ===\n99c3aa21-be69-5ee9-a55a-7a899313e081 (gcal, inbox-search-and-triage), drawn from the client\ntrajectory export. Client ask: set up a standing operating rule for what the mailbox keeps\ncarrying, after going over it.\n\n=== HARDENING ===\nLEVER: B (register population)\nREGISTER: at least one of the messages requesting that document is filed under my Opened label\nSENTENCE: 'The audit's document register (`at least one of the messages requesting that document is filed under my Opened label`) is the population the summary counts are taken over: the log also carries documents that were never entered in the register, and every document in the log is assessed and reported in the audit sheet.'\nLIVES IN: the Opened user label on the acting user's mailbox (label id ea900f63-0dea-592c-84a1-3452922c0af3), reachable only through search_email's label: operator - it is in no search result payload\nCOUNTS MOVED: documents_tracked 10, over the whole log 15; tracked_never_signed 2, over the whole log 4; tracked_signed_after_a_reminder 5, over the whole log 7; tracked_signed_with_no_reminder 3, over the whole log 4. The register also moves the tracked column on 5 of the 15 audit rows, and the drafted write-back set from 4 documents down to 2. The parenthesised `key gold (lazy)` form is deliberately NOT used: lever_check's pair check reads only a NUMERIC expected or expected_value, every figure here is graded by a label-lookup regex over the workbook text, and the one way to give it a number - pinning the value cell by address - is refused by batch_gate as POSITIONAL-XLSX and by review check 1.4. Measured both ways instead: the lazy workbook was built and replayed, and see DEFAULT MISREADING.\nDEFAULT MISREADING: count every document in the log rather than only the register, and mark every row tracked. It answers documents_tracked 15, tracked_never_signed 4, tracked_signed_after_a_reminder 7 and tracked_signed_with_no_reminder 4 against the gold 10, 2, 5 and 3, and writes four names into the drafted email instead of two. Built as a real workbook and replayed through this bundle's own vendored verifier library - the real xlsx.extract_text source command, the real compare() - it scores 0.3580 against the gold workbook's 1.0000 on the same harness. It fails summary_documents_tracked, summary_tracked_never_signed, summary_tracked_signed_after_a_reminder, summary_tracked_signed_with_no_reminder, register_column_reconciles_with_the_summary, documents_the_two_near_identical_names, documents_the_ones_still_unsigned, documents_the_remaining_rows and draft_names_the_unsigned_register_documents, and keeps only the two sheet-shape checks, the header, two row groups, the draft-count check and the tool floor.\nPER-ROW COVERAGE: every document in the log is still assessed and reported. All 15 go in the Documents sheet with their request count, reminder count, signed flag and register flag, and the sheet's row count is itself graded, so the register can never be used to shorten the deliverable. Only the four Summary figures and the drafted write-back are taken at the register's grain, and register_column_reconciles_with_the_summary ties the two together by requiring the sheet's own tracked column to hold the 10 and 5 the summary claims.\nBLIND READER SPLIT: 0 of 4 took the default reading (wrong instead of gold) - measured by tools/readers.py in readers-20260927-204905 against the shipping instruction.md and recorded in consistency/readers.json. All four wrote the register test into their METHOD and scoped every summary count and the write-back to it. On this lane's own measurements 0 of 4 is the normal reading of a FAIR prompt, so it is weak evidence of bite and the number was not chased; what it does establish is that the stated rule and the graded rule select the same set. The firm difficulty evidence is the DEFAULT MISREADING replay above, and the cost the lever imposes is a query the payload cannot answer: no search result carries labelIds at any page size, so the tracked column needs its own label query and an id intersection."


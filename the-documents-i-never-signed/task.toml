host_port = 8016
container_port = 8016
remote_url_env = "EMAIL_CALENDAR_GYM_MCP_REMOTE_URL"
auth_header_name = "x-email-user-token"
access_token = "tok_08525467a73385b0fdad7856f8d080abe0e616c321678acf51d3f2e0e81c7190"
db_id_header_name = "x-database-id"
reset_on_run = true

[verifier]
timeout_sec = 1500.0

[agent]
